# Runs the formal verification (make formal), the check of the coding style
# (VSG), the check of the constants of the model (make consts), and the
# simulation (make sim) on every push and pull request, with the free tools
# installed by scripts/install-tools.sh. Vivado is not free, so the builds for
# the boards are not run here.
#
# The checks run one after the other, and each of them also runs when
# an earlier one has failed (but not when the tools could not be installed).
# The logs of the simulation and of the formal verification are kept as an
# artifact of the run.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The directory added last to GITHUB_PATH comes first in the PATH, so
      # the directories are added in the reverse order. The GHDL with the
      # mcode backend must come before the one of the OSS CAD Suite.
      - name: Install the tools
        id: install
        shell: bash
        run: scripts/install-tools.sh "$RUNNER_TEMP/tools" | tac >> "$GITHUB_PATH"

      - name: Show the versions of the tools
        run: |
          which ghdl
          ghdl --version | head -3
          yosys -V
          sby --version
          vsg --version

      - name: Formal verification (make formal)
        run: make formal

      - name: Coding style (VSG)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          vsg -c vsg.yml -ap -f $(git ls-files '*.vhd' ':!src/vga/font_pkg.vhd' ':!src/hdmi' ':!src/keyboard' ':!src/max10')

      - name: Constants of the model (make consts)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make consts

      - name: Simulation (make sim)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make sim

      - name: Keep the logs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/*.log
            build/*.status
            formal/*/logfile.txt
          if-no-files-found: ignore
